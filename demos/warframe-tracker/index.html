<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warframe Prime Tracker</title>
    <meta name="description" content="Gestiona tu colección de Warframes Prime y Armas Prime. Marca componentes, visualiza progreso y filtra por estado.">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="header-top">
                <div class="logo">
                    <span class="logo-icon">⚡</span>
                    <h1>Prime Tracker</h1>
                </div>

                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="search" class="search-input" id="searchInput" placeholder="Buscar Prime..." autocomplete="off" aria-label="Buscar Prime">
                </div>

                <div class="stats-bar">
                    <div class="stat-item">
                        <span class="stat-value" id="totalComplete">0</span>
                        <span class="stat-label">Completos</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="totalIncomplete">0</span>
                        <span class="stat-label">Incompletos</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="totalProgress">0%</span>
                        <span class="stat-label">Progreso Total</span>
                    </div>
                </div>
            </div>

            <!-- data-tab tiene que coincidir con las claves de ITEMS_BY_TAB en app.js -->
            <nav class="nav-tabs">
                <button type="button" class="nav-tab active" data-tab="warframes">
                    🎭 Warframes <span class="tab-count">0</span>
                </button>
                <button type="button" class="nav-tab" data-tab="weapons">
                    🗡️ Armas <span class="tab-count">0</span>
                </button>
                <button type="button" class="nav-tab" data-tab="sentinels">
                    🤖 Centinelas <span class="tab-count">0</span>
                </button>
                <button type="button" class="nav-tab" data-tab="archwings">
                    🚀 Archwings <span class="tab-count">0</span>
                </button>
            </nav>
        </div>
    </header>

    <section class="controls">
        <div class="filter-group" id="statusFilter">
            <button type="button" class="filter-btn active" data-filter="all">Todos</button>
            <button type="button" class="filter-btn" data-filter="complete">✅ Completos</button>
            <button type="button" class="filter-btn" data-filter="in-progress">⏳ En progreso</button>
            <button type="button" class="filter-btn" data-filter="missing">❌ Faltantes</button>
        </div>

        <!-- Solo se enseña en la pestaña de armas, las opciones las añade app.js -->
        <select class="category-select" id="categoryFilter" aria-label="Categoría" hidden>
            <option value="all">Todas las categorías</option>
        </select>

        <div class="data-controls">
            <button type="button" class="action-btn secondary" id="exportBtn">📥 Exportar Datos</button>
            <button type="button" class="action-btn secondary" id="importBtn">📤 Importar Datos</button>
            <input type="file" id="importFile" accept=".json" hidden>
        </div>
    </section>

    <main class="main-content">
        <div class="items-grid" id="itemsGrid"></div>
    </main>

    <div class="toast-container" id="toastContainer" aria-live="polite"></div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
